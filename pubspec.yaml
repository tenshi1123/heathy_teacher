name: heathy_teacher
description: "application for heathy teacher"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 0.0.1+15

environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  flutter_screenutil: ^5.9.3
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3
  flutter_svg: ^2.2.2
  flutter_slidable: ^4.0.3
  url_launcher: ^6.3.2
  table_calendar: ^3.2.0
  flutter_facebook_auth: ^7.1.6
  screen_protector: ^1.5.1
  firebase_auth: ^6.4.0
  app_links: ^6.4.1
  crypto: ^3.0.7
  device_info_plus: ^12.4.0
  font_awesome_flutter: ^10.9.1
  dio: ^5.8.0+1
  flutter_html: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
  - family: Quicksand
    fonts:
      - asset: assets/fonts/Quicksand-VariableFont_wght.ttf
  - family: QuicksandBold
    fonts:
      - asset: assets/fonts/Quicksand-Bold.ttf
  - family: QuicksandRegular
    fonts:
      - asset: assets/fonts/Quicksand-Regular.ttf
  - family: QuicksandMedium
    fonts:
      - asset: assets/fonts/Quicksand-Medium.ttf
  - family: QuicksandSemiBold
    fonts:
      - asset: assets/fonts/Quicksand-SemiBold.ttf
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/fonts/
    
